# The app's version. Change this on purpose before each release (see README > Releasing).
#   MAJOR: big redesigns or breaking changes
#   MINOR: new features
#   PATCH: bug fixes only
# The Play Store versionCode is worked out from it: MAJOR*10000 + MINOR*100 + PATCH
# (1.19.0 -> 11900), so MINOR and PATCH must stay below 100.
VERSION_NAME=1.21.0
