# Manual release: builds the signed AAB and APK for the version in version.properties,
# uploads the AAB to the chosen Google Play track, then tags the commit and creates the
# GitHub release. Run it from Actions > Release > Run workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track (internal = internal testing, alpha = closed testing, beta = open testing)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "completed = release now, draft = upload and finish it in Play Console"
        type: choice
        options: [completed, draft]
        default: completed
      play:
        description: "Upload to Google Play (untick to publish only the GitHub release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.athulsn10.glancekit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::VERSION_NAME '$name' is not MAJOR.MINOR.PATCH"; exit 1; fi
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      - name: Check this version hasn't been released
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null; then
            echo "::error::${{ steps.v.outputs.tag }} already exists. Bump VERSION_NAME in version.properties."
            exit 1
          fi
          python3 scripts/changelog_section.py "${{ steps.v.outputs.name }}" > release_notes.md
          chars=$(wc -m < distribution/whatsnew/whatsnew-en-US)
          if [ "$chars" -gt 500 ]; then echo "::error::distribution/whatsnew/whatsnew-en-US is $chars characters; Play allows 500."; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build signed AAB and APK
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease assembleRelease --console=plain 2>&1 | tee build.log
          rm -f "$RUNNER_TEMP/upload.jks"
          cp app/build/outputs/bundle/release/app-release.aab "GlanceKit-${{ steps.v.outputs.name }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "GlanceKit-${{ steps.v.outputs.name }}.apk"

      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          msg=$(grep -E "^e: |error:|What went wrong|AAPT|Unresolved|Execution failed" -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"

      - name: Upload to Google Play
        if: ${{ inputs.play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: GlanceKit-${{ steps.v.outputs.name }}.aab
          releaseName: ${{ steps.v.outputs.name }} (${{ steps.v.outputs.code }})
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: distribution/whatsnew

      - name: Tag and publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Glance Kit ${{ steps.v.outputs.name }}
          body_path: release_notes.md
          files: |
            GlanceKit-${{ steps.v.outputs.name }}.apk
            GlanceKit-${{ steps.v.outputs.name }}.aab
          make_latest: true
