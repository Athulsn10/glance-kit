# Manual deploy of the People backend (Firestore rules + Cloud Functions) to Firebase.
# Run from Actions > Deploy backend > Run workflow. Needs the FIREBASE_DEPLOY_SA_JSON secret.
name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      only:
        description: "What to deploy"
        type: choice
        options: ["firestore:rules,functions", "firestore:rules", "functions"]
        default: "firestore:rules,functions"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Deploy
        env:
          SA_JSON: ${{ secrets.FIREBASE_DEPLOY_SA_JSON }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@14 deploy --only "${{ inputs.only }}" --project glance-kit-cf358 --non-interactive --force 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$code" -ne 0 ]; then
            # Show the error on the run summary too.
            msg=$(grep -iE "error|denied|permission|not been used|enable|billing|failed" deploy.log | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Deploy failed::${msg}"
            exit "$code"
          fi
