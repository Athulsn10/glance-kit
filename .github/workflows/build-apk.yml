name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk GlanceKit.apk

      # On failure, surface the compiler errors as an annotation on the run.
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|AAPT|Unresolved|Execution failed" -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: GlanceKit-apk
          path: GlanceKit.apk

      # Each build becomes a numbered release (v1.15.<run>) marked as latest, so this link
      # always gives the newest APK:
      # https://github.com/Athulsn10/glance-kit/releases/latest/download/GlanceKit.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.15.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Glance Kit 1.15.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: GlanceKit.apk
          make_latest: true
