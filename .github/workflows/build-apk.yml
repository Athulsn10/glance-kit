name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GlanceKit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlanceKit-apk
          path: GlanceKit.apk

      # Publishes the APK to a fixed link:
      # https://github.com/Athulsn10/glance-kit/releases/latest/download/GlanceKit.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Glance Kit (latest build)
          body: "Built from ${{ github.sha }}. Download GlanceKit.apk on your phone and tap it to install."
          files: GlanceKit.apk
          make_latest: true
